name: llt_action

on:
  workflow_call:
    inputs:
      image_version:
        required: true
        type: string

jobs:
  JOB_ut:
    name: ut
    steps:
      -
        name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
          token: ${{secrets.GIT_TOKEN}}
      -
        name: download
        uses: obs-download
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          access-key: ${{ secrets.AK }}
          secret-key: ${{ secrets.SK }}
          key: |
            ${{ env.obs_path }}/pr_filelist.txt
            ${{ env.obs_path }}/pr_filelist_mod.txt
            ${{ env.obs_path }}/ut.sh
            ${{ env.obs_path }}/atb_scheduler.py
            ${{ env.obs_path }}/atb_common.py
            ${{ env.obs_path }}/common.sh
            ${{ env.obs_path }}/test_framework/arm64/atb_test_framework.tar.gz
          path: ${{ steps.process_checkout.outputs.path }}
      -
        name: ut
        timeout-minutes: 240
        run: |
          set -ex
          tar -xzf atb_test_framework.tar.gz
          export WORKSPACE=${{ steps.process_checkout.outputs.path }}
          sudo -E bash ${{ steps.process_checkout.outputs.path }}/ut.sh
    if: "${{ default() }}"
    runs-on: ['self-hosted','arch=arm','smoke=204']
    container:
      image: swr.cn-north-4.myhuaweicloud.com/hw-ascend/${{ inputs.image_version }}